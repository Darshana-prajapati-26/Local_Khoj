{% extends "base.html" %}
{% block title %}404 — Page Not Found{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center text-center py-5">
    <div>
        <div style="font-size:7rem;font-weight:800;background:linear-gradient(135deg,#00d2ff,#3a7bd5);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:1rem;">404</div>
        <h2 class="fw-bold mb-2" style="color:#fff;">Page Not Found</h2>
        <p class="mb-4" style="color:#64748b;max-width:400px;margin:0 auto 1.5rem;">The page you're looking for doesn't exist or has been moved.</p>
        <div class="d-flex justify-content-center gap-3">
            <a href="{% url 'home' %}" class="btn btn-primary px-4">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
            <a href="javascript:history.back()" class="btn btn-sm px-4"
                style="background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);color:#94a3b8;border-radius:10px;">
                <i class="bi bi-arrow-left me-2"></i>Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}

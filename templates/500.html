{% extends "base.html" %}
{% block title %}Server Error — Local Khoj{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center text-center py-5">
    <div>
        <div style="font-size:7rem;font-weight:800;background:linear-gradient(135deg,#ff416c,#ff4b2b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:1rem;">500</div>
        <h2 class="fw-bold mb-2" style="color:var(--lk-body-fg);">Something went wrong</h2>
        <p class="mb-4" style="color:var(--lk-muted);max-width:400px;margin:0 auto 1.5rem;">
            Our team has been notified. Please try again in a moment.
        </p>
        <div class="d-flex justify-content-center gap-3">
            <a href="/" class="btn btn-primary px-4">
                <i class="bi bi-house me-2"></i>Go Home
            </a>
            <a href="javascript:location.reload()" class="btn btn-sm px-4"
                style="background:rgba(255,255,255,.06);border:1px solid var(--lk-card-border);color:var(--lk-muted);border-radius:10px;">
                <i class="bi bi-arrow-clockwise me-2"></i>Try Again
            </a>
        </div>
    </div>
</div>
{% endblock %}

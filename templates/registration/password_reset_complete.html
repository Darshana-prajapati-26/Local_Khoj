{% extends "base.html" %}
{% block title %}Password Reset Complete — Local Khoj{% endblock %}
{% block content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-5">
    <div class="w-100 text-center" style="max-width:440px;padding:0 1rem;">
        <div style="width:72px;height:72px;border-radius:20px;background:rgba(56,239,125,.12);border:1px solid rgba(56,239,125,.25);display:flex;align-items:center;justify-content:center;margin:0 auto 1.5rem;animation:popIn .4s ease;">
            <i class="bi bi-check-lg" style="font-size:2rem;color:#38ef7d;"></i>
        </div>
        <h3 class="fw-bold mb-2" style="color:var(--lk-body-fg);">Password Updated!</h3>
        <p style="color:var(--lk-muted);max-width:340px;margin:0 auto 2rem;line-height:1.7;">
            Your password has been successfully reset. You can now sign in with your new password.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary px-5 py-2" style="font-size:1rem;">
            <i class="bi bi-box-arrow-in-right me-2"></i>Sign In Now
        </a>
    </div>
</div>
<style>
@keyframes popIn {
    0%   { transform: scale(.5); opacity: 0; }
    70%  { transform: scale(1.1); }
    100% { transform: scale(1); opacity: 1; }
}
</style>
{% endblock %}
